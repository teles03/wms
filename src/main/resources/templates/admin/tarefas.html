<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Todas as Tarefas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="ml-header">
        <div class="ml-header-content">
            <a href="/home" class="ml-logo">WMS<span>.</span></a>
            <div class="ml-header-user">
                <span>Todas as Tarefas</span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="ml-btn ml-btn-sm ml-btn-warning">Sair</button>
                </form>
            </div>
        </div>
    </header>

    <nav class="ml-nav">
        <div class="ml-nav-content">
            <a href="/admin/dashboard">📊 Produtividade</a>
            <a href="/admin/tarefas" class="active">📋 Todas as Tarefas</a>
        </div>
    </nav>

    <div class="ml-container">
        <div th:if="${sucesso}" class="ml-alert ml-alert-success">
            <span th:text="${sucesso}"></span>
        </div>
        <div th:if="${erro}" class="ml-alert ml-alert-error">
            <span th:text="${erro}"></span>
        </div>

        <div class="ml-card">
            <h1 class="ml-card-title">Todas as Tarefas</h1>

            <form th:action="@{/admin/tarefas}" method="get" class="ml-search">
                <input type="text" name="busca" class="ml-input" th:value="${busca}"
                       placeholder="Buscar por usuário, ID ou caixa (ex: CX-001)...">
                <button type="submit" class="ml-btn ml-btn-primary">🔍 Buscar</button>
                <a href="/admin/tarefas" class="ml-btn ml-btn-warning">Limpar</a>
            </form>

            <table class="ml-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Status</th>
                        <th>Última Armazenagem</th>
                        <th style="width: 220px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t, iter : ${tarefas}">
                        <td><strong>#<span th:text="${t.id}"></span></strong></td>
                        <td th:text="${t.usuario.nome}"></td>
                        <td th:text="${t.inicio}"></td>
                        <td th:text="${t.fim != null ? t.fim : '--'}"></td>
                        <td>
                            <span th:if="${t.status.name() == 'EM_ANDAMENTO'}"
                                  class="ml-badge ml-badge-warning">EM ANDAMENTO</span>
                            <span th:if="${t.status.name() == 'FINALIZADA'}"
                                  class="ml-badge ml-badge-success">FINALIZADA</span>
                            <span th:if="${t.status.name() == 'CANCELADA'}"
                                  class="ml-badge ml-badge-danger">CANCELADA</span>
                        </td>
                        <td>
                            <span class="ml-badge ml-badge-info" th:text="${locais[iter.index]}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/tarefa/{id}(id=${t.id})}"
                               class="ml-btn ml-btn-sm ml-btn-primary">👁 Visualizar</a>
                            <form th:if="${t.status.name() == 'EM_ANDAMENTO'}"
                                  th:action="@{/admin/desvincular}" method="post"
                                  style="display:inline"
                                  onsubmit="return confirm('Desvincular esta tarefa?')">
                                <input type="hidden" name="tarefaId" th:value="${t.id}">
                                <input type="hidden" name="origem" value="tarefas">
                                <button type="submit" class="ml-btn ml-btn-sm ml-btn-danger">❌</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${tarefas.isEmpty()}">
                        <td colspan="7" class="ml-text-center" style="color: #666; padding: 30px;">
                            Nenhuma tarefa encontrada.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
